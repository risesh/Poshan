[build.environment]
  # NEXT_PUBLIC_-prefixed vars are meant to end up in the client-side JS
  # bundle — that's what the prefix means. Netlify's secrets scanner can't
  # tell "intentionally public" apart from "leaked," so without this it
  # fails every build the moment it finds these values in .next/static.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"
